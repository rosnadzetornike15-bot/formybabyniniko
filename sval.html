<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Girl 🎀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pink: #ff85a1; --light-pink: #fbb1bd; --soft-bg: #fff0f3; }
        body { background-color: var(--soft-bg); font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        .card { background: white; width: 350px; padding: 40px; border-radius: 40px; box-shadow: 0 20px 50px rgba(255, 133, 161, 0.2); border: 2px solid #fff; text-align: center; position: relative; z-index: 10; transition: all 0.5s ease; }
        
        h1 { color: #ff4d6d; font-size: 1.8rem; margin-bottom: 20px; font-weight: 800; letter-spacing: -1px; }
        .heart-icon { font-size: 50px; margin-bottom: 10px; display: block; animation: heartbeat 1.2s infinite; }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .btn-stack { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }
        button { padding: 16px; border: none; border-radius: 20px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        #yesBtn { background: #ff4d6d; color: white; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3); }
        #yesBtn:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 77, 109, 0.4); }
        
        #noBtn { background: #eeeeee; color: #999; position: relative; }

        #success-msg { display: none; }
        .love-letter { font-size: 1.1rem; color: #ff758f; line-height: 1.6; font-style: italic; }
        
        /* Floating Sparkles */
        .sparkle { position: absolute; background: var(--pink); border-radius: 50%; pointer-events: none; animation: fly 4s infinite linear; opacity: 0.6; }
        @keyframes fly { 0% { transform: translateY(100vh) scale(0.5); } 100% { transform: translateY(-10vh) scale(1.2); } }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div id="main-content">
            <span class="heart-icon">💖</span>
            <h1 id="question">Will you be my Valentine?</h1>
            <p style="color: #ffb3c1; font-weight: 600;">Only one correct answer, babe.</p>
            
            <div class="btn-stack">
                <button id="yesBtn" onclick="celebrate()">YES, OF COURSE 🎀</button>
                <button id="noBtn" onmouseover="dodge()">No, fuck you</button>
            </div>
        </div>

        <div id="success-msg">
            <span class="heart-icon">🎀✨</span>
            <h1>I KNEW IT!</h1>
            <p class="love-letter">"You're the best thing that's ever happened to me. Can't wait to spend rest of my life with you."</p>
            <div style="font-size: 2rem; margin-top: 20px;">🧸🍭🌸</div>
        </div>
    </div>

    <script>
        // Background Sparkles
        for (let i = 0; i < 20; i++) {
            let sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.width = sparkle.style.height = Math.random() * 8 + 4 + 'px';
            sparkle.style.left = Math.random() * 100 + 'vw';
            sparkle.style.animationDelay = Math.random() * 4 + 's';
            document.body.appendChild(sparkle);
        }

        function dodge() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function celebrate() {
            // High-end confetti effect
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                const particleCount = 50 * (timeLeft / duration);
                confetti({...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }});
                confetti({...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }});
            }, 250);

            // Switch Content
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
            document.getElementById('card').style.borderColor = '#ff4d6d';
            document.body.style.backgroundColor = '#ffc2d1';
        }
    </script>
</body>
</html>
